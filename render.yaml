# Render static site (Blueprint). Same build and headers as Cloudflare Pages (site/_headers):
# the build downloads the model from Hugging Face (tools/fetch-model.mjs) and publishes dist-site/.
# Cross-origin isolation turns on multi-threaded analysis; the page loads nothing from other sites.
services:
  - type: web
    name: soundscope
    runtime: static
    buildCommand: npm ci && npm run build:site
    staticPublishPath: ./dist-site
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
